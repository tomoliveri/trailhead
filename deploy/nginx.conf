# Example nginx site. WebUSB needs HTTPS.
server {
    listen 443 ssl;
    http2 on;
    server_name trailhead.example.org;
    ssl_certificate     /etc/letsencrypt/live/trailhead.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trailhead.example.org/privkey.pem;
    client_max_body_size 4m;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/wasm;
    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
